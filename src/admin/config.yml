backend:
  name: github
  repo: FawadHussainVA/DigitalFadi
  branch: main
  base_url: https://digitalfadi.com
  auth_endpoint: api/auth

media_folder: "src/uploads"
public_folder: "/uploads"

publish_mode: simple
site_url: https://digitalfadi.com

collections:
  - name: "posts"
    label: "Articles"
    label_singular: "Article"
    folder: "src/posts"
    create: true
    slug: "{{slug}}"
    sortable_fields: ["date", "title"]
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        pattern: ['^.{20,60}$', "Keep the title between 20 and 60 characters so Google shows all of it"]
        hint: "Sentence case, 60 characters or fewer, main keyword near the start. Becomes the heading, the page title and the web address."
      - label: "Description"
        name: "description"
        widget: "text"
        pattern: ['^.{50,160}$', "Needs to be between 50 and 160 characters for Google"]
        hint: "Shown on the Learn page and as the Google search snippet."
      - label: "Topic badge"
        name: "topic"
        widget: "select"
        default: "Strategy"
        required: true
        options: ["Search", "Shopping", "Performance Max", "YouTube", "Display",
                  "Demand Gen", "Remarketing", "Local Services", "Tracking", "Strategy"]
      - label: "Publish date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        hint: "Always today's date. Never a future date, future-dated articles index badly."
      - label: "Last updated (optional)"
        name: "updated"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        picker_utc: true
        required: false
        hint: "Only fill this in when you make a real change to an older article. Use today's date. Leave empty for new articles."
      - label: "Order on the Learn page"
        name: "order"
        widget: "number"
        value_type: "int"
        min: 1
        required: false
        hint: "Optional. The Learn page sorts by publish date, newest first. This number only decides the order between articles published on the same day."
      - label: "Article"
        name: "body"
        widget: "markdown"
        hint: "Start with a 40 to 60 word paragraph that answers the question directly. Use Heading 2 for sections. End with a Heading 2 called 'Frequently asked questions' and each question as Heading 3, so the FAQ schema is added automatically. No em dashes."
